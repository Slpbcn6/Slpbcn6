  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.35"/>
    </pattern>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#020202"/>
    </radialGradient>
    <clipPath id="clip"><rect width="900" height="320"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Courier New', Courier, monospace; fill: #FFFFFF; }
    .tg   { fill: #00FF00; }
    .name { font-size: 40px; letter-spacing: -1.5px; }
    .meta { font-size: 14px; opacity: 0.8; }
    .lbl  { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .body { font-size: 14px; }
    .cursor { animation: blink 0.8s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  </style>

